<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CockpitSim — Trainer Registration</title>
  <link rel="stylesheet" href="../shared/css/main.css">
  <link rel="stylesheet" href="../login/login.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <div class="login-screen">

    <div class="hud-bar">
      <span class="hud-label">COCKPITSIM</span>
      <span class="hud-status"><span class="status-dot"></span>SYS ONLINE</span>
    </div>

    <main class="login-panel scanlines">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <header class="login-header">
        <h1 class="login-title">Register Trainer</h1>
        <p class="login-subtitle">New trainer account setup</p>
      </header>

      <form id="register-form" class="login-form" novalidate>
        <div class="field-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="Azlan bin Ismail" required>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="azlan@example.com" required>
        </div>

        <div class="field-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="trainer_azlan" required>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••" required>
            <button type="button" id="toggle-password" aria-label="Show password"></button>
          </div>
        </div>

        <div class="field-group">
          <label for="registrationCode">Registration code</label>
          <input type="text" id="registrationCode" name="registrationCode" class="code-input" placeholder="Enter code" required>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>
        <p id="form-success" class="form-success" role="status" hidden></p>

        <button type="submit" class="btn-login">
          <span>Register Account</span>
        </button>
      </form>

      <footer class="login-footer">
        <span>Already registered? <a href="../login/login.html">Back to login</a></span>
      </footer>
    </main>

  </div>

  <script src="../shared/js/api.js"></script>
  <script src="register.js"></script>
</body>
</html>
