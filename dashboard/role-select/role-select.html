<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CockpitSim — Select Role</title>
  <link rel="stylesheet" href="../shared/css/main.css">
  <link rel="stylesheet" href="role-select.css">
  <link rel="stylesheet" href="../shared/css/cockpit-outline.css">
</head>
<body>

  <div class="role-screen">

    <div class="hud-bar">
      <span class="hud-label">CockpitSim</span>
      <span class="hud-status"><span class="status-dot"></span>Admin preview</span>
    </div>

    <main class="role-panel" data-cockpit-outline>
      <header class="role-header">
        <h1 class="role-title">Select a dashboard</h1>
        <p class="role-subtitle" id="welcome-text">Choose which dashboard to enter</p>
      </header>

      <div class="role-cards">
        <button class="role-card" data-role="trainee" id="card-trainee">
          <div class="corner corner-tl"></div>
          <div class="corner corner-br"></div>
          <span class="role-card-label">Trainee</span>
          <span class="role-card-desc">View assigned exercises and flight scores</span>
        </button>

        <button class="role-card" data-role="trainer" id="card-trainer">
          <div class="corner corner-tl"></div>
          <div class="corner corner-br"></div>
          <span class="role-card-label">Trainer</span>
          <span class="role-card-desc">Review trainee telemetry and progress</span>
        </button>
      </div>

      <a href="../login/login.html" class="back-link">&larr; Back to login</a>
    </main>

  </div>

  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="role-select.js"></script>
</body>
</html>
