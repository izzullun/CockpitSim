<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CockpitSim — Flight Result</title>
  <link rel="icon" type="image/svg+xml" href="../shared/img/sightline-favicon.svg">
  <link rel="stylesheet" href="../shared/css/main.css">
  <link rel="stylesheet" href="../shared/css/theme.css">
  <link rel="stylesheet" href="../shared/css/logout-modal.css">
  <link rel="stylesheet" href="post-session-v2.css">
  <link rel="stylesheet" href="report-panel.css">
  <link rel="stylesheet" href="../shared/css/flight-grade.css">
  <link rel="stylesheet" href="../shared/css/cockpit-outline.css">
</head>
<body class="trainee-result">
  <div class="post-session-screen">
    <header class="hud-bar">
      <a class="top-brand" href="./pre-session.html#mission" aria-label="CockpitSim home"><img src="../shared/img/sightline-lockup.svg" alt="" width="132" height="41"></a>
      <span class="top-flight">Helicopter training</span>
      <span class="hud-value" id="hud-username">Pilot</span>
      <span class="visually-hidden" id="hud-status">Post-session report</span>
      <button class="logout-btn" id="logout-btn" type="button">Log out</button>
    </header>

    <main class="result-workspace">
      <section class="result-card" data-cockpit-outline>
        <h1>Flight Result</h1>
        <p id="summary-exercise"></p>
        <div id="result-grade" class="result-grade"></div>
        <p id="result-score-line" class="result-score-line" hidden><strong id="result-score"></strong><span id="score-unit"> / 100</span></p>
        <p id="result-verdict" role="status">Preparing your result…</p>
        <div class="result-actions">
          <a class="result-primary" href="./pre-session.html#mission">Fly Again</a>
          <button class="result-secondary" id="view-full-report" type="button" disabled>View Full Report</button>
        </div>
      </section>
    </main>
  </div>

  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="../shared/js/logout-modal.js"></script>
  <script src="../shared/js/scenarios.js"></script>
  <script type="module" src="post-session-v2.js"></script>
</body>
</html>
