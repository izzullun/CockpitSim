<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CockpitSim — Login</title>
  <link rel="icon" type="image/svg+xml" href="../shared/img/sightline-favicon.svg">
  <link rel="stylesheet" href="../shared/css/main.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../shared/css/theme.css">
  <link rel="stylesheet" href="../login/auth-layout.css">
  <link rel="stylesheet" href="../shared/css/cockpit-outline.css">
</head>
<body>

  <div class="login-screen">

    <div class="hud-bar">
      <img class="auth-brand" src="../shared/img/sightline-lockup.svg" alt="CockpitSim" width="132" height="41">
      <span class="hud-status"><span class="status-dot" aria-hidden="true"></span>SYS ONLINE</span>
    </div>

    <main class="auth-layout">
      <div class="auth-intro">
        <p class="auth-headline">Steady hands.<br>Clear horizon.</p>
        <p>Basic helicopter training.<br>Every flight is a chance to improve.</p>
      </div>
      <section class="login-panel" aria-labelledby="auth-title">
        <span class="corner corner-tl" aria-hidden="true"></span>
        <span class="corner corner-tr" aria-hidden="true"></span>
        <span class="corner corner-bl" aria-hidden="true"></span>
        <span class="corner corner-br" aria-hidden="true"></span>
      <header class="login-header">
        <h1 class="login-title" id="auth-title">Log in</h1>
        <p class="login-subtitle">Your next flight starts here.</p>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="field-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="trainee_adam" required>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" id="toggle-password" aria-label="Show password"></button>
          </div>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="btn-login">
          <span>Log in</span>
        </button>
      </form>

      <footer class="login-footer">
        <span>Trainer? <a href="../register/register.html">Register here</a></span>
      </footer>
      </section>
    </main>

  </div>

  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
